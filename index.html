<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>解压盒子</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    color: #eee;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  .tabs {
    display: flex;
    gap: 8px;
    padding: 15px;
    z-index: 10;
  }
  .tab {
    padding: 8px 22px;
    border: 2px solid transparent;
    border-radius: 20px;
    background: #16213e;
    color: #888;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.25s;
    font-weight: 500;
  }
  .tab.active {
    background: transparent;
    border-color: #e94560;
    color: #e94560;
  }
  .tab:hover { border-color: #e94560; color: #e94560; }

  #gameArea {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  #combo {
    position: fixed;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 48px;
    font-weight: bold;
    color: #e94560;
    pointer-events: none;
    opacity: 0;
    z-index: 100;
    text-shadow: 0 0 20px rgba(233,69,96,0.5);
  }
  #combo.show { animation: comboPop 0.4s ease-out; }
  @keyframes comboPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1) translateY(-30px); }
  }

  .shake { animation: shake 0.15s ease-out; }
  @keyframes shake {
    0%, 100% { transform: translate(0); }
    25% { transform: translate(-3px, 2px); }
    50% { transform: translate(3px, -2px); }
    75% { transform: translate(-2px, -1px); }
  }

  .particle {
    position: fixed;
    pointer-events: none;
    border-radius: 50%;
    z-index: 50;
  }

  #bubbleSheet {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 10px;
    padding: 20px;
  }
  .bubble {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #b8e4ff, #5aafff);
    box-shadow: inset 0 -4px 8px rgba(0,0,0,0.2), 0 3px 8px rgba(0,0,0,0.15), 0 0 12px rgba(90,175,255,0.2);
    cursor: pointer;
    transition: transform 0.1s;
    position: relative;
  }
  .bubble::after {
    content: '';
    position: absolute;
    top: 12px; left: 14px;
    width: 10px; height: 6px;
    background: rgba(255,255,255,0.6);
    border-radius: 50%;
    transform: rotate(-30deg);
  }
  .bubble:hover { transform: scale(1.08); }
  .bubble.popping {
    animation: popAnim 0.2s ease-out forwards;
  }
  @keyframes popAnim {
    0% { transform: scale(1); }
    40% { transform: scale(1.15); }
    100% { transform: scale(0.85); opacity: 0.6; background: radial-gradient(circle at 35% 35%, #444, #2a2a2a); box-shadow: inset 0 4px 8px rgba(0,0,0,0.4); }
  }

  #glassArea {
    width: 520px; height: 380px;
    background: linear-gradient(135deg, rgba(180,220,255,0.35), rgba(120,180,230,0.15));
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 10px;
    position: relative;
    cursor: crosshair;
    overflow: hidden;
    backdrop-filter: blur(3px);
    box-shadow: 0 0 40px rgba(100,180,255,0.1), inset 0 0 60px rgba(255,255,255,0.05);
  }
  .crack-line {
    position: absolute;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
    transform-origin: left center;
    pointer-events: none;
  }
  .shard {
    position: absolute;
    background: linear-gradient(135deg, rgba(180,220,255,0.6), rgba(120,180,230,0.3));
    border: 1px solid rgba(255,255,255,0.3);
    pointer-events: none;
    animation: shardFall 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }
  @keyframes shardFall {
    0% { opacity: 1; }
    100% { transform: translateY(250px) rotate(var(--rot)) scale(0.5); opacity: 0; }
  }
  .glass-flash {
    position: absolute;
    width: 60px; height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.8), transparent);
    pointer-events: none;
    animation: flashOut 0.3s ease-out forwards;
  }
  @keyframes flashOut {
    to { transform: scale(3); opacity: 0; }
  }

  #counter {
    position: fixed;
    bottom: 20px;
    left: 20px;
    color: #555;
    font-size: 14px;
  }
  #resetBtn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 8px 22px;
    border: 1px solid #333;
    border-radius: 8px;
    background: #1a1a2e;
    color: #888;
    cursor: pointer;
    font-size: 14px;
    transition: 0.2s;
  }
  #resetBtn:hover { border-color: #e94560; color: #e94560; }
</style>
</head>
<body>

<div class="tabs">
  <button class="tab active" data-mode="bubble">捏泡泡</button>
  <button class="tab" data-mode="glass">砸玻璃</button>
</div>

<div id="gameArea"></div>
<div id="combo"></div>
<div id="counter"></div>
<button id="resetBtn">重置</button>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new AudioCtx();
  return audioCtx;
}

function playPop() {
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.connect(gain);
  gain.connect(ctx.destination);
  const freq = 600 + Math.random() * 500;
  osc.frequency.setValueAtTime(freq, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.1);
  gain.gain.setValueAtTime(0.35, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
  osc.start();
  osc.stop(ctx.currentTime + 0.1);
}

function playCrash() {
  const ctx = getAudioCtx();
  const bufferSize = ctx.sampleRate * 0.15;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
  }
  const source = ctx.createBufferSource();
  source.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 2000;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.4, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
  source.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);
  source.start();
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 3 + Math.random() * 6;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.background = color;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    document.body.appendChild(p);
    const angle = Math.random() * Math.PI * 2;
    const velocity = 40 + Math.random() * 80;
    const dx = Math.cos(angle) * velocity;
    const dy = Math.sin(angle) * velocity;
    p.animate([
      { transform: 'translate(0,0) scale(1)', opacity: 1 },
      { transform: 'translate(' + dx + 'px, ' + (dy + 60) + 'px) scale(0)', opacity: 0 }
    ], { duration: 400 + Math.random() * 200, easing: 'ease-out' });
    setTimeout(function() { p.remove(); }, 600);
  }
}

let comboCount = 0;
let comboTimer = null;
const comboEl = document.getElementById('combo');

function addCombo() {
  comboCount++;
  clearTimeout(comboTimer);
  if (comboCount >= 3) {
    comboEl.textContent = comboCount + ' 连击!';
    comboEl.classList.remove('show');
    void comboEl.offsetWidth;
    comboEl.classList.add('show');
  }
  comboTimer = setTimeout(function() { comboCount = 0; }, 800);
}

let currentMode = 'bubble';
let count = 0;
const area = document.getElementById('gameArea');
const counterEl = document.getElementById('counter');

function setMode(mode) {
  currentMode = mode;
  count = 0;
  comboCount = 0;
  counterEl.textContent = '';
  document.querySelectorAll('.tab').forEach(function(t) {
    t.classList.toggle('active', t.dataset.mode === mode);
  });
  area.innerHTML = '';
  if (mode === 'bubble') initBubble();
  else if (mode === 'glass') initGlass();
}

document.querySelectorAll('.tab').forEach(function(tab) {
  tab.addEventListener('click', function() { setMode(tab.dataset.mode); });
});

document.getElementById('resetBtn').addEventListener('click', function() {
  setMode(currentMode);
});

function initBubble() {
  const sheet = document.createElement('div');
  sheet.id = 'bubbleSheet';
  let popped = 0;
  const total = 48;

  for (let i = 0; i < total; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    b.addEventListener('click', function(e) {
      if (b.classList.contains('popping')) return;
      b.classList.add('popping');
      popped++;
      count++;
      addCombo();
      playPop();
      const rect = b.getBoundingClientRect();
      spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, '#5aafff', 6);
      counterEl.textContent = popped + ' / ' + total;
      if (popped === total) {
        counterEl.textContent = '全部捏完！';
        for (let j = 0; j < 5; j++) {
          setTimeout(function() {
            const colors = ['#e94560', '#5aafff', '#ffd700'];
            spawnParticles(
              window.innerWidth / 2 + (Math.random() - 0.5) * 300,
              window.innerHeight / 2 + (Math.random() - 0.5) * 200,
              colors[Math.floor(Math.random() * 3)],
              12
            );
          }, j * 100);
        }
        setTimeout(function() { initBubble(); }, 1500);
      }
    });
    sheet.appendChild(b);
  }
  area.appendChild(sheet);
}

function initGlass() {
  const glass = document.createElement('div');
  glass.id = 'glassArea';
  let hitCount = 0;
  const maxHits = 40;

  glass.addEventListener('click', function(e) {
    const rect = glass.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const flash = document.createElement('div');
    flash.className = 'glass-flash';
    flash.style.left = (x - 30) + 'px';
    flash.style.top = (y - 30) + 'px';
    glass.appendChild(flash);
    setTimeout(function() { flash.remove(); }, 300);

    const crackCount = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < crackCount; i++) {
      const line = document.createElement('div');
      line.className = 'crack-line';
      line.style.left = x + 'px';
      line.style.top = y + 'px';
      const len = 30 + Math.random() * 60;
      line.style.width = len + 'px';
      line.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
      glass.appendChild(line);
    }

    const shardCount = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < shardCount; i++) {
      const shard = document.createElement('div');
      shard.className = 'shard';
      const size = 8 + Math.random() * 20;
      shard.style.width = size + 'px';
      shard.style.height = size + 'px';
      shard.style.left = (x - size / 2 + (Math.random() - 0.5) * 20) + 'px';
      shard.style.top = (y - size / 2 + (Math.random() - 0.5) * 20) + 'px';
      shard.style.setProperty('--rot', (Math.random() * 60 - 30) + 'deg');
      shard.style.borderRadius = Math.random() > 0.5 ? '30% 70% 50% 40%' : '50% 30% 60% 40%';
      glass.appendChild(shard);
      setTimeout(function() { shard.remove(); }, 800);
    }

    document.body.classList.add('shake');
    setTimeout(function() { document.body.classList.remove('shake'); }, 150);
    spawnParticles(e.clientX, e.clientY, 'rgba(180,220,255,0.8)', 5);

    hitCount++;
    count++;
    addCombo();
    playCrash();
    counterEl.textContent = '敲击 ' + hitCount + ' / ' + maxHits;

    if (hitCount >= maxHits) {
      glass.style.transition = 'opacity 0.5s';
      glass.style.opacity = '0';
      counterEl.textContent = '玻璃已粉碎！';
      for (let i = 0; i < 8; i++) {
        setTimeout(function() {
          spawnParticles(
            window.innerWidth / 2 + (Math.random() - 0.5) * 400,
            window.innerHeight / 2 + (Math.random() - 0.5) * 200,
            'rgba(180,220,255,0.7)',
            10
          );
        }, i * 60);
      }
      setTimeout(function() { initGlass(); }, 1500);
    }
  });

  area.appendChild(glass);
}

setMode('bubble');
</script>
</body>
</html>
